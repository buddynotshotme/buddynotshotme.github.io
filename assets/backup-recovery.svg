<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="20" fill="#f3f7f9"/><text x="40" y="48" font-family="Arial" font-size="22" font-weight="bold" fill="#17324d">BACKUP & RECOVERY LIFECYCLE</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="130" width="175" height="115" rx="12" fill="#dcecf4" stroke="#2878a8" stroke-width="2"/><text x="132" y="175" font-size="19" font-weight="bold" fill="#17324d">Protect</text><text x="132" y="205" font-size="14" fill="#627687">Veeam · EBS · RDS</text><rect x="270" y="130" width="175" height="115" rx="12" fill="#dcecf4" stroke="#2878a8" stroke-width="2"/><text x="357" y="175" font-size="19" font-weight="bold" fill="#17324d">Restore</text><text x="357" y="205" font-size="14" fill="#627687">Select recovery point</text><rect x="495" y="130" width="175" height="115" rx="12" fill="#e5f2ed" stroke="#4ba7a1" stroke-width="2"/><text x="582" y="175" font-size="19" font-weight="bold" fill="#17324d">Validate</text><text x="582" y="205" font-size="14" fill="#627687">OS · DB · Application</text><rect x="720" y="130" width="135" height="115" rx="12" fill="#e5f2ed" stroke="#4ba7a1" stroke-width="2"/><text x="787" y="175" font-size="19" font-weight="bold" fill="#17324d">Return</text><text x="787" y="205" font-size="14" fill="#627687">Service</text><path d="M220 188H270M445 188H495M670 188H720" stroke="#167d86" stroke-width="4"/><text x="450" y="315" font-family="Arial" font-size="17" text-anchor="middle" fill="#627687">A successful backup job is not proof of recoverability.</text><text x="450" y="345" font-family="Arial" font-size="17" text-anchor="middle" fill="#167d86">Restore, verify, document.</text></g></svg>